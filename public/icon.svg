<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#131A2A"/>
      <stop offset="100%" stop-color="#060810"/>
    </radialGradient>
    <!-- Blue top glow -->
    <radialGradient id="glow-top" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#1A60C8" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0A30A0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0A30A0" stop-opacity="0"/>
    </radialGradient>
    <!-- Chrome gradient for logo -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="20%"  stop-color="#D4DCE8"/>
      <stop offset="45%"  stop-color="#8898AC"/>
      <stop offset="70%"  stop-color="#B8C4D4"/>
      <stop offset="100%" stop-color="#F0F4FF"/>
    </linearGradient>
    <!-- Chrome dark edge -->
    <radialGradient id="chrome-sphere" cx="38%" cy="32%" r="65%">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#C8D4E4"/>
      <stop offset="100%" stop-color="#607080"/>
    </radialGradient>
    <!-- Blue text gradient -->
    <linearGradient id="xtz-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#60C0FF"/>
      <stop offset="40%"  stop-color="#2080FF"/>
      <stop offset="100%" stop-color="#0840C0"/>
    </linearGradient>
    <!-- Yamaha text gradient -->
    <linearGradient id="yamaha-silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="50%"  stop-color="#C8D0DC"/>
      <stop offset="100%" stop-color="#A0ACBC"/>
    </linearGradient>
    <!-- Ring glow -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow-text" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000820" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Top blue glow haze -->
  <ellipse cx="256" cy="80" rx="260" ry="200" fill="url(#glow-top)"/>

  <!-- ── SPEEDOMETER RING ──────────────────────────────── -->
  <!-- Outer dark ring -->
  <circle cx="256" cy="218" r="214" fill="none" stroke="#1A3A70" stroke-width="2"/>
  <!-- Main blue ring -->
  <circle cx="256" cy="218" r="206" fill="none" stroke="#2468C8" stroke-width="6" filter="url(#glow-blue)" opacity="0.9"/>
  <!-- Inner ring subtle -->
  <circle cx="256" cy="218" r="196" fill="none" stroke="#1040A0" stroke-width="1.5" opacity="0.5"/>

  <!-- Tick marks (every 10°, 36 total) around the ring -->
  <g transform="translate(256,218)">
    <!-- Major ticks every 30° (12 ticks, longer) -->
    <line x1="0" y1="-198" x2="0" y2="-184" stroke="#4090E0" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="-198" x2="0" y2="-184" stroke="#4090E0" stroke-width="3.5" stroke-linecap="round" transform="rotate(30)"/>
    <line x1="0" y1="-198" x2="0" y2="-184" stroke="#4090E0" stroke-width="3.5" stroke-linecap="round" transform="rotate(60)"/>
    <line x1="0" y1="-198" x2="0" y2="-184" stroke="#4090E0" stroke-width="3.5" stroke-linecap="round" transform="rotate(90)"/>
    <line x1="0" y1="-198" x2="0" y2="-184" stroke="#4090E0" stroke-width="3.5" stroke-linecap="round" transform="rotate(120)"/>
    <line x1="0" y1="-198" x2="0" y2="-184" stroke="#4090E0" stroke-width="3.5" stroke-linecap="round" transform="rotate(150)"/>
    <line x1="0" y1="-198" x2="0" y2="-184" stroke="#4090E0" stroke-width="3.5" stroke-linecap="round" transform="rotate(180)"/>
    <line x1="0" y1="-198" x2="0" y2="-184" stroke="#4090E0" stroke-width="3.5" stroke-linecap="round" transform="rotate(210)"/>
    <line x1="0" y1="-198" x2="0" y2="-184" stroke="#4090E0" stroke-width="3.5" stroke-linecap="round" transform="rotate(240)"/>
    <line x1="0" y1="-198" x2="0" y2="-184" stroke="#4090E0" stroke-width="3.5" stroke-linecap="round" transform="rotate(270)"/>
    <line x1="0" y1="-198" x2="0" y2="-184" stroke="#4090E0" stroke-width="3.5" stroke-linecap="round" transform="rotate(300)"/>
    <line x1="0" y1="-198" x2="0" y2="-184" stroke="#4090E0" stroke-width="3.5" stroke-linecap="round" transform="rotate(330)"/>
    <!-- Minor ticks every 10° (between majors, shorter) -->
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(10)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(20)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(40)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(50)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(70)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(80)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(100)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(110)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(130)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(140)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(160)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(170)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(190)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(200)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(220)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(230)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(250)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(260)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(280)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(290)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(310)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(320)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(340)"/>
    <line x1="0" y1="-198" x2="0" y2="-190" stroke="#2860B0" stroke-width="2" stroke-linecap="round" transform="rotate(350)"/>
  </g>

  <!-- ── YAMAHA TUNING FORK LOGO (center 256, 210) ──────── -->
  <!-- Background circle (dark recessed) -->
  <circle cx="256" cy="210" r="150" fill="#0A0E1A" opacity="0.7"/>
  <circle cx="256" cy="210" r="148" fill="none" stroke="#1A3060" stroke-width="2"/>

  <!-- Outer logo ring -->
  <circle cx="256" cy="210" r="128" fill="none" stroke="url(#chrome)" stroke-width="5" opacity="0.6"/>

  <!-- ── Three prongs of the Yamaha symbol ── -->
  <!-- Prong UP: tip center (256, 88) -->
  <path d="M 248 195 L 244 104 Q 256 82 268 104 L 264 195 Z" fill="url(#chrome)"/>
  <circle cx="256" cy="84" r="24" fill="url(#chrome-sphere)"/>
  <circle cx="249" cy="78" r="7" fill="white" opacity="0.4"/>

  <!-- Prong LOWER-RIGHT: tip center (370, 268) -->
  <!-- Direction: 30° from horizontal, arm width 14px -->
  <path d="M 265 220 L 355 270 Q 376 278 370 295 L 277 237 Z" fill="url(#chrome)"/>
  <circle cx="374" cy="285" r="24" fill="url(#chrome-sphere)"/>
  <circle cx="365" cy="276" r="7" fill="white" opacity="0.4"/>

  <!-- Prong LOWER-LEFT: tip center (142, 268) -->
  <path d="M 247 220 L 157 270 Q 136 278 142 295 L 235 237 Z" fill="url(#chrome)"/>
  <circle cx="138" cy="285" r="24" fill="url(#chrome-sphere)"/>
  <circle cx="130" cy="276" r="7" fill="white" opacity="0.4"/>

  <!-- Center circle of Yamaha symbol -->
  <circle cx="256" cy="210" r="26" fill="url(#chrome-sphere)"/>
  <circle cx="248" cy="202" r="8" fill="white" opacity="0.35"/>

  <!-- ── TEXT ──────────────────────────────────────────── -->
  <!-- YAMAHA -->
  <text x="256" y="372"
    text-anchor="middle"
    font-family="Arial Black, Impact, sans-serif"
    font-size="50" font-weight="900"
    letter-spacing="7"
    fill="url(#yamaha-silver)"
    filter="url(#shadow-text)">YAMAHA</text>

  <!-- XTZ — large blue italic -->
  <text x="258" y="462"
    text-anchor="middle"
    font-family="Arial Black, Impact, sans-serif"
    font-size="100" font-weight="900"
    font-style="italic"
    letter-spacing="3"
    fill="url(#xtz-blue)"
    filter="url(#shadow-text)">XTZ</text>

  <!-- Subtle blue bottom glow under XTZ -->
  <ellipse cx="256" cy="478" rx="180" ry="28" fill="#1050C0" opacity="0.25"/>
</svg>
